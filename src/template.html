<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
  </head>
  <body>
    <header class="header">
      <div class="logo"></div>
    </header>
    <nav class="nav">
      <div class="nav-views">
        <button type="button" data-view="inbox">Inbox</button>
        <button type="button" data-view="today">Today</button>
        <button type="button" data-view="week">This Week</button>
        <button type="button" data-view="upcoming">Upcoming</button>
        <button type="button" data-view="completed">Completed</button>
      </div>
      <div class="nav-projects">
        <h2>My Projects</h2>
        <ul id="project-list"></ul>
        <button type="button" id="add-project">Add Project</button>
        <form id="project-form" class="project-form hidden">
          <div class="project-form-header">
            <button
              id="close-project-btn"
              class="close-project-btn"
              aria-label="close"
              type="button"
            >
              X
            </button>
          </div>
          <div class="project-form-body">
            <label class="project-form-label" for="name-input"
              >Project name</label
            >
            <input
              required
              type="text"
              class="form-control"
              id="name-input"
              value=""
            />
          </div>
          <div class="project-form-footer">
            <button id="submit-project-btn" class="btn large-btn" type="submit">
              Submit project
            </button>
          </div>
        </form>
      </div>
    </nav>
    <main class="main">
      <div class="todo-content" id="todos">
        <h1 id="view-title">My tasks</h1>
        <ul id="todo-list"></ul>
        <button type="button" id="add-task">Add Task</button>
        <form id="todo-form" class="todo-form hidden">
          <div class="todo-form-header">
            <button
              id="close-todo-btn"
              class="close-todo-btn"
              aria-label="close"
              type="button"
            >
              X
            </button>
          </div>
          <div class="todo-form-body">
            <label class="todo-form-label" for="todo-name-input">Title</label>
            <input
              required
              type="text"
              class="form-control"
              id="todo-name-input"
              value=""
            />
            <label class="todo-form-label" for="todo-date-input">Date</label>
            <input
              required
              type="date"
              class="form-control"
              id="todo-date-input"
              value=""
            />
            <label class="todo-priority-label" for="todo-priority"
              >Priority:</label
            >
            <select id="todo-priority" name="todo-priority">
              <option value="">Select a priority</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
            <label class="todo-form-label" for="todo-description-input"
              >Description</label
            >
            <textarea
              class="todo-description"
              id="todo-description-input"
              cols="30"
              rows="5"
            ></textarea>
          </div>
          <div class="todo-form-footer">
            <button id="add-todo-btn" class="btn" type="submit">
              Add task
            </button>
          </div>
        </form>
      </div>
    </main>
    <footer class="footer"></footer>
  </body>
</html>
